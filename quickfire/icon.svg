<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><title>Letteramble: scattered purple ramble letters, with soft lette lettering behind</title><defs><radialGradient id="paper"><stop stop-color="#fff"/><stop offset="1" stop-color="#eee5fc"/></radialGradient><filter id="soft" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter></defs><rect width="512" height="512" rx="110" fill="url(#paper)"/><g font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="middle"><text x="256" y="190" font-size="145" fill="#61586c" opacity=".25" filter="url(#soft)">lette</text><g fill="#713bd8"><text x="99" y="258" font-size="144" transform="rotate(-17 99 258)">r</text><text x="246" y="279" font-size="135" transform="rotate(13 246 279)">a</text><text x="378" y="255" font-size="134" transform="rotate(-8 378 255)">m</text><text x="103" y="417" font-size="134" transform="rotate(12 103 417)">b</text><text x="258" y="405" font-size="159" transform="rotate(-19 258 405)">l</text><text x="372" y="421" font-size="145" transform="rotate(16 372 421)">e</text></g></g></svg>